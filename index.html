<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rahulinder Singh | Portfolio</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Ephesis&family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">

    <style>
        /* General Page Setup */
        body {
            background-color: #FFE6A6; /* Your requested background color */
            margin: 0;
            padding: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Poppins', sans-serif;
            overflow: hidden; /* Prevents scrollbars */
            position: relative;
        }

        /* The Background "Watermark" Name */
        .background-name {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) rotate(-10deg);
            font-family: 'Ephesis', cursive;
            font-size: 15vw; /* Responsive size (15% of viewport width) */
            color: #000;
            opacity: 0.04; /* Very faint to look "embedded" */
            white-space: nowrap;
            z-index: 0; /* Puts it behind everything */
            pointer-events: none; /* Allows you to click through it */
            user-select: none;
        }

        /* The Main Card Container */
        .card {
            background: rgba(255, 255, 255, 0.65); /* Semi-transparent white */
            backdrop-filter: blur(8px); /* Blur effect behind the card */
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.1);
            width: 90%;
            max-width: 400px;
            text-align: center;
            z-index: 1;
            border: 1px solid rgba(255, 255, 255, 0.4);
        }

        /* Profile Image / Initials Circle (Optional visual touch) */
        .profile-icon {
            width: 80px;
            height: 80px;
            background-color: #333;
            color: #FFE6A6;
            border-radius: 50%;
            margin: 0 auto 15px auto;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 32px;
            font-weight: bold;
        }

        /* Email Styling */
        .email {
            font-size: 0.95rem;
            color: #555;
            text-decoration: none;
            margin-bottom: 30px;
            display: inline-block;
            font-weight: 500;
            padding: 5px 10px;
            background: rgba(255,255,255,0.5);
            border-radius: 8px;
            transition: all 0.2s;
        }

        .email:hover {
            color: #000;
            background: rgba(255,255,255,0.8);
        }

        /* Links List */
        .links-container {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .link-btn {
            background-color: #fff;
            color: #333;
            text-decoration: none;
            padding: 15px 20px;
            border-radius: 12px;
            font-weight: 600;
            display: flex;
            justify-content: space-between; /* Puts arrow on the right */
            align-items: center;
            box-shadow: 0 4px 6px rgba(0,0,0,0.03);
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }

        .link-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 15px rgba(0,0,0,0.08);
            background-color: #fffdf5;
        }

        .arrow {
            font-size: 1.2rem;
            color: #999;
        }
    </style>
</head>
<body>

    <div class="background-name">RahulinderSingh Sidhu</div>

    <div class="card">
        <div class="profile-icon">RS</div>
        
        <a href="mailto:rsidhu_be24@thapar.edu" class="email">rsidhu_be24@thapar.edu</a>

        <div class="links-container">
            <a href="https://github.com/rahulinder/DSA" target="_blank" class="link-btn">
                <span>DSA Repository</span>
                <span class="arrow">→</span>
            </a>

            <a href="https://github.com/rahulinder/DAA" target="_blank" class="link-btn">
                <span>DAA Repository</span>
                <span class="arrow">→</span>
            </a>

            <a href="https://github.com/rahulinder/VS" target="_blank" class="link-btn">
                <span>VS Code Configuration</span>
                <span class="arrow">→</span>
            </a>

            <a href="#" class="link-btn">
                <span>First Website Project</span>
                <span class="arrow">→</span>
            </a>
        </div>
    </div>

</body>
</html>
