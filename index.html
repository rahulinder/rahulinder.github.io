<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rahulinder Singh Sidhu</title>

    <link rel="icon" type="image/png" href="https://img.icons8.com/color/150/full-moon.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Ephesis&family=Poppins:wght@300;400&display=swap" rel="stylesheet">
    <link href="https://fonts.cdnfonts.com/css/niagara-engraved" rel="stylesheet">

    <style>
        /* General Reset */
        body {
            background-color: #FFE6A6;
            margin: 0;
            padding: 0;
            height: 100vh;
            display: flex;
            flex-direction: column;
            font-family: 'Poppins', sans-serif;
            overflow-x: hidden;
            
            /* DISABLE TEXT SELECTION GLOBALLY */
            -webkit-user-select: none;
            -moz-user-select: none;
            -ms-user-select: none;
            user-select: none;
        }

        /* Header Styling */
        header {
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 30px;
            position: relative;
            z-index: 100;
        }

        /* Logo Container - Clickable */
        .logo-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            cursor: pointer;
            z-index: 101; /* Keep logo ABOVE the menu */
            transition: transform 0.3s ease;
            position: relative;
        }

        .logo-container:hover {
            transform: scale(1.05);
        }

        .logo {
            font-family: 'Niagara Engraved', sans-serif;
            font-size: 130px;
            color: #000;
            margin: 0;
            line-height: 0.8;
            letter-spacing: 2px;
        }

        /* The Separation Line - Centered Logic */
        .logo-line {
            width: 1500px;
            height: 2px;
            background-color: #000;
            margin-top: 15px;
            /* Force center alignment */
            position: relative;
            left: 50%;
            transform: translateX(-50%);
        }

        .line-wrapper {
            width: 100%;
            overflow: visible; 
            display: flex;
            justify-content: center;
        }

        /* Main Content Area */
        main {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            text-align: center;
            z-index: 1;
            position: relative;
        }

        /* Name Wrapper - Draggable */
        .name-wrapper {
            position: relative;
            display: inline-block;
            cursor: grab;
            transition: transform 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .name-wrapper:active {
            cursor: grabbing;
        }

        /* Name and Hi text styles */
        h1.main-name, h1.hi-msg {
            font-family: 'Ephesis', cursive;
            font-size: 110px;
            font-weight: normal;
            color: #720026;
            margin: 0;
            padding: 0 10px;
            line-height: 1.1;
            transition: all 0.5s cubic-bezier(0.68, -0.55, 0.27, 1.55);
            pointer-events: none;
        }

        h1.main-name {
            opacity: 1;
            transform: scale(1);
        }

        h1.hi-msg {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) scale(0);
            opacity: 0;
            width: 100%;
        }

        .underline {
            position: absolute;
            left: 50%;
            bottom: 10px;
            width: 0;
            height: 2px;
            background-color: #720026;
            transition: width 0.4s ease, left 0.4s ease;
            pointer-events: none;
        }

        /* --- HOVER STATES --- */
        .name-wrapper:hover .main-name {
            transform: scale(1.15);
            text-shadow: 0 10px 20px rgba(114, 0, 38, 0.2);
        }

        .name-wrapper:hover .underline {
            width: 80%;
            left: 10%;
        }

        /* --- ACTIVE STATES (Hi Animation) --- */
        .name-wrapper.active .main-name {
            opacity: 0;
            transform: scale(0.5);
        }

        .name-wrapper.active .hi-msg {
            opacity: 1;
            transform: translate(-50%, -50%) scale(1.2);
        }

        .name-wrapper.active .underline {
            width: 0 !important;
            opacity: 0;
        }

        /* Footer Area (Socials) */
        .footer-container {
            padding: 40px;
            text-align: center;
            z-index: 1;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .social-row {
            display: flex;
            gap: 40px;
            justify-content: center;
            align-items: center;
        }

        .social-icon img {
            width: 35px;
            height: 35px;
            transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            filter: opacity(0.8); 
            image-rendering: -webkit-optimize-contrast;
        }

        .social-icon:hover img {
            transform: scale(1.3);
            filter: opacity(1);
        }

        /* --- DROPDOWN MENU FIXED --- */
        .dropdown-menu {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            
            /* Initial State: Height 0 and Padding 0 to be completely invisible */
            height: 0;
            padding-top: 0; 
            
            background-color: rgba(255, 255, 255, 0.5);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            z-index: 90;
            overflow: hidden;
            
            /* Animate height and padding together */
            transition: height 0.5s cubic-bezier(0.19, 1, 0.22, 1), 
                        padding-top 0.5s cubic-bezier(0.19, 1, 0.22, 1);
            
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            box-shadow: 0 10px 30px rgba(0,0,0,0.05);
        }

        /* When Open: Add height AND padding */
        .dropdown-menu.open {
            height: 50vh;
            padding-top: 100px; /* Moves links down below the logo */
        }

        .dropdown-menu a {
            padding: 15px 0;
            text-decoration: none;
            font-size: 1.5rem;
            color: #222;
            display: block;
            transition: 0.3s;
            font-weight: 500;
            opacity: 0;
            transform: translateY(-20px);
        }

        .dropdown-menu.open a {
            opacity: 1;
            transform: translateY(0);
        }

        /* Staggered animation */
        .dropdown-menu.open a:nth-child(1) { transition-delay: 0.1s; }
        .dropdown-menu.open a:nth-child(2) { transition-delay: 0.2s; }
        .dropdown-menu.open a:nth-child(3) { transition-delay: 0.3s; }
        .dropdown-menu.open a:nth-child(4) { transition-delay: 0.4s; }

        .dropdown-menu a:hover {
            color: #720026;
            transform: scale(1.1) !important;
        }

        #overlay {
            position: fixed;
            display: none;
            width: 100%;
            height: 100%;
            top: 0;
            left: 0;
            background-color: rgba(0,0,0,0.2);
            z-index: 80;
            backdrop-filter: blur(2px);
        }

        @media (max-width: 600px) {
            h1.main-name, h1.hi-msg { font-size: 70px; }
            .logo { font-size: 90px; }
            .dropdown-menu.open { height: 60vh; }
        }
    </style>
</head>
<body>

    <header>
        <div class="logo-container" onclick="toggleMenu()">
            <div class="logo">R</div>
            <div class="line-wrapper">
                <div class="logo-line"></div>
            </div>
        </div>
    </header>

    <main>
        <div id="dragName" class="name-wrapper">
            <h1 class="main-name">Rahulinder Singh Sidhu</h1>
            <h1 class="hi-msg">Hi!</h1>
            <div class="underline"></div>
        </div>
    </main>

    <div class="footer-container">
        <div class="social-row">
            <a href="mailto:rsidhu_be24@thapar.edu" class="social-icon">
                <img src="https://img.icons8.com/external-kmg-design-basic-outline-kmg-design/200/external-email-interface-essentials-kmg-design-basic-outline-kmg-design.png" alt="Email">
            </a>

            <a href="https://www.instagram.com/rahulinder20/" target="_blank" class="social-icon">
                <img src="https://img.icons8.com/ios/200/instagram-new--v1.png" alt="Instagram">
            </a>

            <a href="https://www.linkedin.com/in/rahulinder-singh-sidhu-0a52563b1" target="_blank" class="social-icon">
                <img src="https://img.icons8.com/ios/200/linkedin.png" alt="LinkedIn">
            </a>
        </div>
    </div>

    <div id="overlay" onclick="toggleMenu()"></div>

    <div id="myDropdown" class="dropdown-menu">
        <a href="https://github.com/rahulinder/DSA" target="_blank">DSA Repository</a>
        <a href="https://github.com/rahulinder/DAA" target="_blank">DAA Repository</a>
        <a href="https://github.com/rahulinder/VS" target="_blank">VS Code Config</a>
        <a href="#">First Website Project</a>
    </div>

    <script>
        // --- MENU FUNCTIONS ---
        function toggleMenu() {
            const menu = document.getElementById("myDropdown");
            const overlay = document.getElementById("overlay");
            
            menu.classList.toggle("open");
            
            if (menu.classList.contains("open")) {
                overlay.style.display = "block";
            } else {
                overlay.style.display = "none";
            }
        }

        // --- DRAG & DROP LOGIC ---
        const draggable = document.getElementById('dragName');
        let isDragging = false;
        let startX, startY;
        let diffX = 0, diffY = 0;
        let hasMoved = false;

        draggable.addEventListener('mousedown', (e) => {
            isDragging = true;
            hasMoved = false;
            startX = e.clientX;
            startY = e.clientY;
            draggable.style.transition = 'none';
        });

        window.addEventListener('mousemove', (e) => {
            if (!isDragging) return;
            diffX = e.clientX - startX;
            diffY = e.clientY - startY;

            if (Math.abs(diffX) > 5 || Math.abs(diffY) > 5) {
                hasMoved = true;
            }
            draggable.style.transform = `translate(${diffX}px, ${diffY}px)`;
        });

        window.addEventListener('mouseup', () => {
            if (!isDragging) return;
            isDragging = false;

            draggable.style.transition = 'transform 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275)';
            draggable.style.transform = 'translate(0px, 0px)';

            if (!hasMoved) {
                triggerHiAnimation();
            }
        });

        // --- HI ANIMATION TRIGGER (1.5s) ---
        function triggerHiAnimation() {
            draggable.classList.add("active");
            setTimeout(() => {
                draggable.classList.remove("active");
            }, 1500);
        }
    </script>

</body>
</html>
