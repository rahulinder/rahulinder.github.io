<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rahulinder Singh Sidhu</title>

    <link rel="icon" type="image/png" href="https://img.icons8.com/stickers/100/oggy.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Ephesis&family=Poppins:wght@300;400&display=swap" rel="stylesheet">
    <link href="https://fonts.cdnfonts.com/css/niagara-engraved" rel="stylesheet">

    <style>
        /* General Reset */
        body {
            background-color: #FFE6A6;
            margin: 0;
            padding: 0;
            height: 100vh;
            display: flex;
            flex-direction: column;
            font-family: 'Poppins', sans-serif;
            overflow-x: hidden;
            
            /* DISABLE TEXT SELECTION GLOBALLY */
            -webkit-user-select: none; /* Safari */
            -moz-user-select: none; /* Firefox */
            -ms-user-select: none; /* IE10+/Edge */
            user-select: none; /* Standard */
        }

        /* Header Styling */
        header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            padding: 20px 30px;
            position: relative;
            z-index: 2;
        }

        .menu-icon {
            font-size: 35px;
            cursor: pointer;
            color: #333;
            margin-top: 10px;
            z-index: 10;
            transition: transform 0.2s;
        }

        .menu-icon:hover {
            transform: scale(1.1);
        }

        /* Logo Container */
        .logo-container {
            position: absolute;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            flex-direction: column;
            align-items: center;
            pointer-events: none;
        }

        .logo {
            font-family: 'Niagara Engraved', sans-serif;
            font-weight: bold;
            font-size: 110px;
            color: #000;
            margin: 0;
            line-height: 0.8;
            letter-spacing: 2px;
        }

        .logo-line {
            width: 150px;
            height: 2px;
            background-color: #000;
            margin-top: 15px;
        }

        /* Main Content Area */
        main {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            text-align: center;
            z-index: 1;
            position: relative;
        }

        /* Name Wrapper - Draggable */
        .name-wrapper {
            position: relative;
            display: inline-block;
            cursor: grab; /* Shows hand icon */
            /* Ensure transforms happen smoothly when released */
            transition: transform 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .name-wrapper:active {
            cursor: grabbing; /* Shows grabbing hand when clicking */
        }

        /* Common style for Name and Hi text */
        h1.main-name, h1.hi-msg {
            font-family: 'Ephesis', cursive;
            font-size: 110px;
            font-weight: normal;
            color: #720026;
            margin: 0;
            padding: 0 10px;
            line-height: 1.1;
            transition: all 0.5s cubic-bezier(0.68, -0.55, 0.27, 1.55);
            pointer-events: none; /* Let clicks pass through to wrapper */
        }

        /* The Name Text */
        h1.main-name {
            opacity: 1;
            transform: scale(1);
        }

        /* The "Hi" Text - Hidden by default */
        h1.hi-msg {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) scale(0);
            opacity: 0;
            width: 100%;
        }

        /* The Animated Underline */
        .underline {
            position: absolute;
            left: 50%;
            bottom: 10px;
            width: 0;
            height: 2px;
            background-color: #720026;
            transition: width 0.4s ease, left 0.4s ease;
            pointer-events: none;
        }

        /* --- HOVER STATES (Only when not dragging) --- */
        .name-wrapper:hover .main-name {
            transform: scale(1.15);
            text-shadow: 0 10px 20px rgba(114, 0, 38, 0.2);
        }

        .name-wrapper:hover .underline {
            width: 80%;
            left: 10%;
        }

        /* --- CLICKED / ACTIVE STATES (Hi Animation) --- */
        .name-wrapper.active .main-name {
            opacity: 0;
            transform: scale(0.5);
        }

        .name-wrapper.active .hi-msg {
            opacity: 1;
            transform: translate(-50%, -50%) scale(1.2);
        }

        .name-wrapper.active .underline {
            width: 0 !important;
            opacity: 0;
        }


        /* Email Footer */
        .email-footer {
            padding: 40px;
            text-align: center;
            z-index: 1;
        }

        .email-link {
            font-family: 'Poppins', sans-serif;
            font-size: 1.1rem;
            color: #333;
            text-decoration: none;
            display: inline-block;
            transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275), color 0.2s;
        }

        .email-link:hover {
            color: #720026;
            transform: scale(1.2);
        }

        /* Side Menu Styles */
        .side-menu {
            height: 100%;
            width: 0;
            position: fixed;
            z-index: 20;
            top: 0;
            left: 0;
            background-color: rgba(255, 255, 255, 0.98);
            overflow-x: hidden;
            transition: 0.4s ease;
            padding-top: 60px;
            box-shadow: 2px 0 15px rgba(0,0,0,0.1);
        }

        .side-menu a {
            padding: 15px 30px;
            text-decoration: none;
            font-size: 1.2rem;
            color: #333;
            display: block;
            transition: 0.2s;
            white-space: nowrap;
        }

        .side-menu a:hover {
            background-color: #FFE6A6;
            color: #720026;
            padding-left: 40px;
        }

        .side-menu .close-btn {
            position: absolute;
            top: 10px;
            right: 25px;
            font-size: 40px;
            margin-left: 0;
            cursor: pointer;
            color: #720026;
        }

        #overlay {
            position: fixed;
            display: none;
            width: 100%;
            height: 100%;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-color: rgba(0,0,0,0.4);
            z-index: 15;
            backdrop-filter: blur(2px);
        }

        /* Mobile Responsiveness */
        @media (max-width: 600px) {
            h1.main-name, h1.hi-msg { font-size: 70px; }
            .logo { font-size: 90px; }
            .side-menu { width: 0; }
        }
    </style>
</head>
<body>

    <header>
        <div class="menu-icon" onclick="openMenu()">&#9776;</div>
        
        <div class="logo-container">
            <div class="logo">R</div>
            <div class="logo-line"></div>
        </div>

        <div style="width: 35px;"></div> 
    </header>

    <main>
        <div id="dragName" class="name-wrapper">
            <h1 class="main-name">Rahulinder Singh Sidhu</h1>
            <h1 class="hi-msg">Hi!</h1>
            <div class="underline"></div>
        </div>
    </main>

    <div class="email-footer">
        <a href="mailto:rsidhu_be24@thapar.edu" class="email-link">rsidhu_be24@thapar.edu</a>
    </div>

    <div id="overlay" onclick="closeMenu()"></div>

    <div id="mySideMenu" class="side-menu">
        <a href="javascript:void(0)" class="close-btn" onclick="closeMenu()">&times;</a>
        <a href="https://github.com/rahulinder/DSA" target="_blank">DSA Repository</a>
        <a href="https://github.com/rahulinder/DAA" target="_blank">DAA Repository</a>
        <a href="https://github.com/rahulinder/VS" target="_blank">VS Code Config</a>
        <a href="#">First Website Project</a>
    </div>

    <script>
        // --- MENU FUNCTIONS ---
        function openMenu() {
            document.getElementById("mySideMenu").style.width = "300px";
            document.getElementById("overlay").style.display = "block";
        }

        function closeMenu() {
            document.getElementById("mySideMenu").style.width = "0";
            document.getElementById("overlay").style.display = "none";
        }

        // --- DRAG & DROP LOGIC ---
        const draggable = document.getElementById('dragName');
        let isDragging = false;
        let startX, startY;
        let diffX = 0, diffY = 0;
        let hasMoved = false; // To distinguish between click and drag

        // MOUSE DOWN (Start Drag)
        draggable.addEventListener('mousedown', (e) => {
            isDragging = true;
            hasMoved = false;
            
            // Record initial mouse position
            startX = e.clientX;
            startY = e.clientY;
            
            // Remove transition for instant following
            draggable.style.transition = 'none';
        });

        // MOUSE MOVE (Dragging)
        window.addEventListener('mousemove', (e) => {
            if (!isDragging) return;

            // Calculate how far we moved
            diffX = e.clientX - startX;
            diffY = e.clientY - startY;

            // If moved more than 5 pixels, count it as a drag (not a click)
            if (Math.abs(diffX) > 5 || Math.abs(diffY) > 5) {
                hasMoved = true;
            }

            // Apply movement
            draggable.style.transform = `translate(${diffX}px, ${diffY}px)`;
        });

        // MOUSE UP (End Drag)
        window.addEventListener('mouseup', () => {
            if (!isDragging) return;
            isDragging = false;

            // Add bounce transition back
            draggable.style.transition = 'transform 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275)';
            
            // Snap back to center
            draggable.style.transform = 'translate(0px, 0px)';

            // If we didn't move much, treat it as a CLICK (trigger Hi animation)
            if (!hasMoved) {
                triggerHiAnimation();
            }
        });

        // --- HI ANIMATION TRIGGER ---
        function triggerHiAnimation() {
            draggable.classList.add("active");
            setTimeout(() => {
                draggable.classList.remove("active");
            }, 2000);
        }
    </script>

</body>
</html>
