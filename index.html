<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rahulinder Singh Sidhu</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Ephesis&family=Poppins:wght@300;400&display=swap" rel="stylesheet">
    <link href="https://fonts.cdnfonts.com/css/parchment" rel="stylesheet">

    <style>
        /* General Reset and Layout */
        body {
            background-color: #FFE6A6;
            margin: 0;
            padding: 0;
            height: 100vh;
            display: flex;
            flex-direction: column;
            font-family: 'Poppins', sans-serif;
            overflow-x: hidden;
        }

        /* Header Styling */
        header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start; /* Aligns items to top */
            padding: 20px 30px;
            position: relative;
            z-index: 2;
        }

        .menu-icon {
            font-size: 35px;
            cursor: pointer;
            color: #333;
            margin-top: 10px; /* Align with logo center */
        }

        /* Logo Container to hold R and the Line */
        .logo-container {
            position: absolute;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .logo {
            font-family: 'Niagara Engraved', cursive;
            font-size: 120px; /* Slightly larger logo */
            color: #000;
            margin: 0;
            line-height: 0.8; /* Reduces gap above/below letter */
        }

        /* The Horizontal Line below logo */
        .logo-line {
            width: 1500px; /* Length of the line */
            height: 2px;
            background-color: #000;
            margin-top: 20px;
        }

        /* Main Content Area */
        main {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            z-index: 1;
        }

        /* Main Name Styling */
        h1.main-name {
            font-family: 'Ephesis', cursive;
            font-size: 110px; /* Increased Size */
            font-weight: normal;
            color: #720026; /* New Color */
            margin: 0;
            padding: 0 20px;
            line-height: 1.1;
        }

        /* Email Footer */
        .email-footer {
            padding: 40px;
            text-align: center;
            z-index: 1;
        }

        .email-link {
            font-family: 'Poppins', sans-serif;
            font-size: 1.1rem;
            color: #333;
            text-decoration: none;
            transition: color 0.2s;
        }

        .email-link:hover {
            color: #720026;
        }

        /* Side Menu Styles */
        .side-menu {
            height: 100%;
            width: 0;
            position: fixed;
            z-index: 3;
            top: 0;
            left: 0;
            background-color: rgba(255, 255, 255, 0.98);
            overflow-x: hidden;
            transition: 0.3s;
            padding-top: 60px;
            box-shadow: 2px 0 10px rgba(0,0,0,0.1);
        }

        .side-menu a {
            padding: 15px 30px;
            text-decoration: none;
            font-size: 1.2rem;
            color: #333;
            display: block;
            transition: 0.2s;
        }

        .side-menu a:hover {
            background-color: #FFE6A6;
            color: #720026;
        }

        .side-menu .close-btn {
            position: absolute;
            top: 10px;
            right: 20px;
            font-size: 36px;
            margin-left: 50px;
            cursor: pointer;
        }

        #overlay {
            position: fixed;
            display: none;
            width: 100%;
            height: 100%;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-color: rgba(0,0,0,0.4);
            z-index: 2;
        }

        /* Mobile Responsiveness */
        @media (max-width: 600px) {
            h1.main-name {
                font-size: 70px; /* Smaller on phone so it fits */
            }
            .logo {
                font-size: 90px;
            }
        }
    </style>
</head>
<body>

    <header>
        <div class="menu-icon" onclick="openMenu()">&#9776;</div>
        
        <div class="logo-container">
            <div class="logo">R</div>
            <div class="logo-line"></div>
        </div>

        <div style="width: 35px;"></div> 
    </header>

    <main>
        <h1 class="main-name">Rahulinder Singh Sidhu</h1>
    </main>

    <div class="email-footer">
        <a href="mailto:rsidhu_be24@thapar.edu" class="email-link">rsidhu_be24@thapar.edu</a>
    </div>

    <div id="overlay" onclick="closeMenu()"></div>

    <div id="mySideMenu" class="side-menu">
        <a href="javascript:void(0)" class="close-btn" onclick="closeMenu()">&times;</a>
        <a href="https://github.com/rahulinder/DSA" target="_blank">DSA Repository</a>
        <a href="https://github.com/rahulinder/DAA" target="_blank">DAA Repository</a>
        <a href="https://github.com/rahulinder/VS" target="_blank">VS Code Config</a>
        <a href="#">First Website Project</a>
    </div>

    <script>
        function openMenu() {
            document.getElementById("mySideMenu").style.width = "300px";
            document.getElementById("overlay").style.display = "block";
        }

        function closeMenu() {
            document.getElementById("mySideMenu").style.width = "0";
            document.getElementById("overlay").style.display = "none";
        }
    </script>

</body>
</html>
