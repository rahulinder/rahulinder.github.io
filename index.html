<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rahulinder Singh Sidhu</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Ephesis&family=Poppins:wght@300;400&display=swap" rel="stylesheet">
    <link href="https://fonts.cdnfonts.com/css/parchment" rel="stylesheet">

    <style>
        /* General Reset and Layout */
        body {
            background-color: #FFE6A6;
            margin: 0;
            padding: 0;
            height: 100vh;
            display: flex;
            flex-direction: column;
            font-family: 'Poppins', sans-serif;
            overflow-x: hidden; /* Prevent horizontal scroll from menu */
        }

        /* Header with Menu Icon and Logo */
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 30px;
            position: relative;
            z-index: 2; /* Ensure header is above other content */
        }

        .menu-icon {
            font-size: 30px;
            cursor: pointer;
            color: #333;
        }

        .logo {
            font-family: 'Parchment', cursive;
            font-size: 100px;
            color: #000;
            position: absolute;
            left: 50%;
            transform: translateX(-50%);
            margin: 0;
        }

        /* Main Content Area */
        main {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            z-index: 1;
        }

        /* Main Name */
        h1.main-name {
            font-family: 'Ephesis', cursive;
            font-size: 70px;
            font-weight: normal;
            color: #000;
            margin: 0;
            padding: 0 20px; /* Add padding for smaller screens */
        }

        /* Email Footer */
        .email-footer {
            padding: 30px;
            text-align: center;
            z-index: 1;
        }

        .email-link {
            font-family: 'Poppins', sans-serif;
            font-size: 1.1rem;
            color: #333;
            text-decoration: none;
            transition: color 0.2s;
        }

        .email-link:hover {
            color: #000;
        }

        /* Side Menu Styles */
        .side-menu {
            height: 100%;
            width: 0; /* Initially hidden */
            position: fixed;
            z-index: 3; /* On top of everything */
            top: 0;
            left: 0;
            background-color: rgba(255, 255, 255, 0.95);
            overflow-x: hidden;
            transition: 0.3s; /* Smooth slide effect */
            padding-top: 60px;
            box-shadow: 2px 0 5px rgba(0,0,0,0.1);
        }

        .side-menu a {
            padding: 15px 30px;
            text-decoration: none;
            font-size: 1.2rem;
            color: #333;
            display: block;
            transition: 0.2s;
        }

        .side-menu a:hover {
            background-color: #FFE6A6;
            color: #000;
        }

        .side-menu .close-btn {
            position: absolute;
            top: 10px;
            right: 20px;
            font-size: 36px;
            margin-left: 50px;
            cursor: pointer;
        }

        /* Overlay for when menu is open */
        #overlay {
            position: fixed;
            display: none; /* Hidden by default */
            width: 100%;
            height: 100%;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-color: rgba(0,0,0,0.4); /* Black background with opacity */
            z-index: 2; /* Below the menu but above content */
            cursor: pointer;
        }
    </style>
</head>
<body>

    header>
        <div class="menu-icon" onclick="openMenu()">&#9776;</div>
        <div class="logo">R</div>
        <div style="width: 30px;"></div> </header>

    <main>
        <h1 class="main-name">Rahulinder Singh Sidhu</h1>
    </main>

    <div class="email-footer">
        <a href="mailto:rsidhu_be24@thapar.edu" class="email-link">rsidhu_be24@thapar.edu</a>
    </div>

    <div id="overlay" onclick="closeMenu()"></div>

    <div id="mySideMenu" class="side-menu">
        <a href="javascript:void(0)" class="close-btn" onclick="closeMenu()">&times;</a>
        <a href="https://github.com/rahulinder/DSA" target="_blank">DSA Repository</a>
        <a href="https://github.com/rahulinder/DAA" target="_blank">DAA Repository</a>
        <a href="https://github.com/rahulinder/VS" target="_blank">VS Code Config</a>
        <a href="#">First Website Project</a>
    </div>

    <script>
        function openMenu() {
            document.getElementById("mySideMenu").style.width = "300px";
            document.getElementById("overlay").style.display = "block";
        }

        function closeMenu() {
            document.getElementById("mySideMenu").style.width = "0";
            document.getElementById("overlay").style.display = "none";
        }
    </script>

</body>
</html>
